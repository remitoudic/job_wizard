repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c "cd services/frontend && bun run format"
        language: system
        files: \.(js|ts|svelte|css|scss|html|json|md)$
        pass_filenames: false

      - id: svelte-check
        name: svelte-check
        entry: bash -c "cd services/frontend && bun run check"
        language: system
        files: \.(svelte|ts|js)$
        pass_filenames: false
