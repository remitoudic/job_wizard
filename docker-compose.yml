services:
  postgres:
    build:
      context: ./services/database
    container_name: jobwizard-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobwizard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
      POSTGRES_DB: ${POSTGRES_DB:-jobwizard}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init-temporal.sql:/docker-entrypoint-initdb.d/init-temporal.sql
    networks:
      - jobwizard-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobwizard}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: jobwizard-ollama
    environment:
      - OLLAMA_DEBUG=0
      - OLLAMA_ORIGINS=*
    logging:
      driver: "none"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - jobwizard-network
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: jobwizard-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobwizard:changeme123@postgres:5432/jobwizard}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      LLAMA_CLOUD_API_KEY: ${LLAMA_CLOUD_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./services/backend/app:/app/app
      - ./services/backend/tests:/app/tests
      - backend_uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      - jobwizard-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      target: development
    container_name: jobwizard-frontend

    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    networks:
      - jobwizard-network
    depends_on:
      - backend
    command: sh -c "bun run svelte-kit sync && bun run dev -- --host 0.0.0.0 --port 5173"

  worker:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: jobwizard-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jobwizard:changeme123@postgres:5432/jobwizard}
      TEMPORAL_HOST: ${TEMPORAL_HOST:-temporal:7233}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
    volumes:
      - ./services/backend/app:/app/app
      - backend_uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      - jobwizard-network
    depends_on:
      temporal:
        condition: service_started
      postgres:
        condition: service_healthy
    command: uv run python -m app.worker

  temporal:
    image: temporalio/auto-setup:latest
    container_name: jobwizard-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-jobwizard}
      - POSTGRES_PWD=${POSTGRES_PASSWORD:-changeme123}
      - POSTGRES_SEEDS=postgres
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - SKIP_SCHEMA_SETUP=false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobwizard-network

  temporal-ui:
    image: temporalio/ui:latest
    container_name: jobwizard-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - jobwizard-network

networks:
  jobwizard-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  backend_uploads:
