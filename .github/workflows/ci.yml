name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Install dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.5.x"
      - name: Install pre-commit
        run: uv tool install pre-commit
      - name: Install frontend dependencies
        run: |
          cd services/frontend
          bun install
      - name: Run pre-commit
        run: pre-commit run --all-files

  backend-tests:
    name: Backend Tests (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.5.x"
      - name: Install backend dependencies
        run: |
          uv venv
          uv pip install -e ./services/database
          uv pip install -e "./services/backend[dev]"
      - name: Run unit tests
        run: |
          cd services/backend
          ../../.venv/bin/pytest tests/unit

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"
      - name: Install dependencies
        run: |
          cd services/frontend
          bun install
      - name: Run svelte-check
        run: |
          cd services/frontend
          bun run check
      - name: Run tests
        run: |
          cd services/frontend
          bun run test

  deploy:
    name: Deploy Production
    needs: [lint, backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /root/job_wizard
            ./scripts/update-production.sh -y
