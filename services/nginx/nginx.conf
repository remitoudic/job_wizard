# Nginx Configuration for Job Wizard Production
# This reverse proxy routes all traffic and hides internal service ports.
#
# DNS strategy: uses Docker's embedded resolver (127.0.0.11) with set variables
# so nginx re-resolves hostnames every 30s instead of caching IPs at startup.
# This prevents 502 Bad Gateway errors after backend/frontend container restarts.

server {
    listen 80;
    listen [::]:80;
    
    server_name job-vite.com www.job-vite.com;
    
    # Client body size limit (for file uploads)
    client_max_body_size 50M;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check endpoint for Docker (bypasses HTTPS redirect)
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy';
    }

    # Redirect http to https
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    server_name job-vite.com www.job-vite.com;
    
    resolver 127.0.0.11 valid=30s;
    
    ssl_certificate /etc/nginx/ssl/live/job-vite.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/job-vite.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client body size limit
    client_max_body_size 50M;

    # Backend API routes - proxy to backend service
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        
        # WebSocket support (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts — generous for cover letter generation & file uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
    }

    # Docs routes - proxy to backend service
    location /docs {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI JSON - proxy to backend service
    location /openapi.json {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint - proxy to backend
    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Static uploads - serve directly from Nginx
    location /uploads/ {
        alias /app/uploads/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }

    # Frontend - all other routes go to the SvelteKit app
    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend$request_uri;
        proxy_http_version 1.1;
        
        # WebSocket support for HMR (though in production, HMR won't be used)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }
}
