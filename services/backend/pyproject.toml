[project]
name = "job-wizard-backend"
version = "0.1.0"
description = "Job Wizard Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "psycopg[binary]>=3.1.18",
    "psycopg2-binary>=2.9.9",
    "sse-starlette>=2.0.0",
    "alembic>=1.13.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    "reportlab>=4.0.9",
    "pillow>=10.2.0",
    "ollama>=0.1.6",
    "python-dotenv>=1.0.0",
    "pydantic-ai>=0.0.14",
    "logfire[fastapi]>=0.46.0",
    "sqlmodel>=0.0.14",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==3.2.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "job-wizard-db @ file:///Users/Remi/Documents/job_wizard/services/database",
    "curl_cffi>=0.6.0",
    "weasyprint>=62.0",
    "llama-parse>=0.5.0",
    "jinja2>=3.1.0",
    "cloudinary>=1.44.1",
    "edgeparse>=0.2.3",
    "temporalio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "respx>=0.21.0",
    "ruff>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    # Third-party library warnings we can't fix
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:llama_parse.*",
    "ignore::DeprecationWarning:llama_cloud_services.*",
    "ignore::DeprecationWarning:pydantic.*",
    # Suppress llama-parse deprecation from our app code importing it
    "ignore:The.*llama-parse.*package is deprecated",
]
