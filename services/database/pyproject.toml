[project]
name = "job-wizard-db"
version = "0.1.0"
description = "Database models and management for Job Wizard"
dependencies = [
    "sqlmodel",
    "psycopg2-binary",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==3.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["database_pkg"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
