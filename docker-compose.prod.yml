# Production Docker Compose Configuration
# Use this on your production server with: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    build:
      context: ./database
    container_name: jobwizard-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # NO PORT MAPPING - only accessible within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jobwizard-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: jobwizard-ollama-prod
    restart: unless-stopped
    environment:
      - OLLAMA_DEBUG=0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # NO PORT MAPPING - only accessible within Docker network
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - jobwizard-network
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jobwizard-backend-prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS}
    # NO PORT MAPPING - only accessible via nginx
    volumes:
      - backend_uploads:/app/uploads
      - ./backups:/app/backups
    networks:
      - jobwizard-network
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: jobwizard-frontend-prod
    restart: unless-stopped
    environment:
      - ORIGIN=${ORIGIN}
      - VITE_API_URL=${VITE_API_URL}
    # NO PORT MAPPING - only accessible via nginx
    networks:
      - jobwizard-network
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: jobwizard-nginx-prod
    restart: unless-stopped
    ports:
      # ONLY expose nginx ports - this is the only entry point
      - "80:80"
      - "443:443"
    volumes:
      # Mount nginx config (if you want to update without rebuilding)
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount for SSL certificates (share with certbot)
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
      # Mount shared uploads volume to serve static files
      - backend_uploads:/app/uploads:ro
    networks:
      - jobwizard-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: jobwizard-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # No network needed usually, but good to have if it needs to talk to others
    # command: certonly --webroot -w /var/www/certbot --force-renewal --email YOUR_EMAIL -d job-vite.com -d www.job-vite.com --agree-tos
    # We will run the command manually first

networks:
  jobwizard-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
  backend_uploads:
