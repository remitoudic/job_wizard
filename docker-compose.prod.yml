# Production Docker Compose Configuration
# Use this on your production server with: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: jobwizard-postgres:latest
    build:
      context: ./services/database
    container_name: jobwizard-postgres-prod
    restart: unless-stopped
    env_file:
      - .env/.env.production
    # NO PORT MAPPING - only accessible within Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/database/init-temporal.sql:/docker-entrypoint-initdb.d/init-temporal.sql
    networks:
      - jobwizard-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jobwizard" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: jobwizard-ollama-prod
    restart: unless-stopped
    environment:
      - OLLAMA_DEBUG=0
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    deploy:
      resources:
        limits:
          memory: 12G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # NO PORT MAPPING - only accessible within Docker network
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - jobwizard-network
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    image: jobwizard-backend:latest
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: jobwizard-backend-prod
    restart: unless-stopped
    env_file:
      - .env/.env.production
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
    # NO PORT MAPPING - only accessible via nginx
    volumes:
      - backend_uploads:/app/uploads
      - ./services/backups:/app/backups
    networks:
      - jobwizard-network
    depends_on:
      - postgres
      - ollama
      - temporal
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  frontend:
    image: jobwizard-frontend:latest
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: jobwizard-frontend-prod
    restart: unless-stopped
    env_file:
      - .env/.env.production
    # NO PORT MAPPING - only accessible via nginx
    networks:
      - jobwizard-network
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

  nginx:
    image: jobwizard-nginx:latest
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
    container_name: jobwizard-nginx-prod
    restart: unless-stopped
    ports:
      # ONLY expose nginx ports - this is the only entry point
      - "80:80"
      - "443:443"
    volumes:
      # Mount nginx config (if you want to update without rebuilding)
      - ./services/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount for SSL certificates (share with certbot)
      - ./services/certbot/conf:/etc/nginx/ssl:ro
      - ./services/certbot/www:/var/www/certbot:ro
      # Mount shared uploads volume to serve static files
      - backend_uploads:/app/uploads:ro
    networks:
      - jobwizard-network
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      restart_policy:
        condition: on-failure

  worker:
    image: jobwizard-worker:latest
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    container_name: jobwizard-worker-prod
    restart: unless-stopped
    env_file:
      - .env/.env.production
    # environment variables handled by env_file
    volumes:
      - backend_uploads:/app/uploads
      - ./services/backups:/app/backups
    networks:
      - jobwizard-network
    depends_on:
      - temporal
      - postgres
    command: python -m app.worker
    deploy:
      restart_policy:
        condition: on-failure

  temporal:
    image: temporalio/auto-setup:latest
    container_name: jobwizard-temporal-prod
    restart: unless-stopped
    env_file:
      - .env/.env.production
    environment:
      - DB=postgres12
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - SKIP_SCHEMA_SETUP=false
    depends_on:
      - postgres
    networks:
      - jobwizard-network
    deploy:
      restart_policy:
        condition: on-failure

  temporal-ui:
    image: temporalio/ui:latest
    container_name: jobwizard-temporal-ui-prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - jobwizard-network
    deploy:
      restart_policy:
        condition: on-failure

  certbot:
    image: certbot/certbot
    container_name: jobwizard-certbot
    volumes:
      - ./services/certbot/conf:/etc/letsencrypt
      - ./services/certbot/www:/var/www/certbot
    # No network needed usually, but good to have if it needs to talk to others
    # command: certonly --webroot -w /var/www/certbot --force-renewal --email YOUR_EMAIL -d job-vite.com -d www.job-vite.com --agree-tos
    # We will run the command manually first
    deploy:
      mode: replicated
      replicas: 0
      restart_policy:
        condition: none

networks:
  jobwizard-network:
    driver: overlay
    attachable: true

volumes:
  postgres_data:
  ollama_data:
  backend_uploads:
